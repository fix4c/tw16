name: 每日醫療資訊更新

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: 抓取並改寫醫療資訊
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-headlines.mjs
      - name: 抓取全台醫院名錄
        run: node scripts/fetch-hospitals.mjs
      - name: 抓取健保診所資料
        run: node scripts/fetch-clinics.mjs

      - name: 提交並推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json data/clinics.json data/hospitals.json
          git diff --staged --quiet && echo "无变化，跳过提交" && exit 0
          git commit -m "chore: 每日自動更新醫療資訊 [skip ci]"
          git push